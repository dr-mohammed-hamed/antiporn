name: AntiPorn Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Project Constitution (Zero Leaks Gate)
        run: |
          echo "Checking for prohibited files..."
          if [ -f "app/keystore/antiporn-release.jks" ]; then
            echo "Security Violation: antiporn-release.jks was checked into Git!" && exit 1
          fi
          if [ -f "local.properties" ]; then
            echo "Security Violation: local.properties was checked into Git!" && exit 1
          fi
          if [ -f "HISN_CONTEXT.md" ]; then
            echo "Privacy Violation: HISN_CONTEXT.md must not be tracked in Git!" && exit 1
          fi
          echo "Constitutional check passed: 0 secret leaks detected."

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Automated Unit Test Suites
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
